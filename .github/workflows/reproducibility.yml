name: Reproducibility pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run post-FlashFry pipeline
        run: python scripts/run_pipeline.py

      - name: Show validation report
        if: always()
        run: cat generated/reproducibility_validation_report.md

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-validation-report
          path: |
            generated/reproducibility_validation_report.md
            generated/reproducibility_validation_report.json
